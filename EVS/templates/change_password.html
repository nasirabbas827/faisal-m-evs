{% extends "base.html" %} 
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title">Change Your Password</h2>

          <form method="post" class="password-change-form">
            {% csrf_token %} 
            {% for fm in form %}
              <div class="form-group">
                {{fm.label_tag}}
                {{fm}}
                <small class="text-danger">{{fm.errors|striptags}}</small>
              </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">
              Change Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>


{% endblock %}
